<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="ELSEWHERE — a hypnotic browser rhythm runner. Thread the gates, ride the beat. Procedural music, procedural worlds, zero assets.">
<title>ELSEWHERE — a rhythm runner</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<canvas id="gl"></canvas>

<div id="ui">

  <!-- ============ MENU ============ -->
  <section id="menu" class="screen">
    <div class="top">
      <button class="btn tiny" data-act="credits">CREDITS</button>
      <button class="btn tiny" data-act="share">SHARE</button>
    </div>

    <div class="center">
      <h1 class="wordmark">Elsewhere</h1>
      <div class="tagline">ANYWHERE BUT HERE</div>
      <div class="tagline dim">A BROWSER RHYTHM RUNNER &middot; VOL. I</div>
    </div>

    <div class="bottom">
      <button class="btn tiny" data-act="settings">SETTINGS</button>
      <button class="btn start" data-act="start">PRESS SPACE TO START</button>
      <button class="btn tiny" data-act="fullscreen">FULL SCREEN</button>
    </div>

    <div class="musicbadge">MUSIC BY<br><b>PROCEDURAL</b></div>
  </section>

  <!-- ============ HUD ============ -->
  <section id="hud" class="screen hidden">
    <div class="hud-tl">
      <div class="label">SCORE</div>
      <div class="value" id="hud-score">0</div>
    </div>
    <div class="hud-tr">
      <div class="label">BEST</div>
      <div class="value dim" id="hud-best">0</div>
    </div>
    <div class="hud-bl">
      <div class="label">SPEED</div>
      <div class="bar"><i id="hud-speed"></i></div>
    </div>
    <div class="hud-br">
      <div class="label">COMBO</div>
      <div class="value" id="hud-combo">&times;1</div>
    </div>

    <div class="reticle" id="reticle">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="currentColor" stroke-width="2.5"/>
      </svg>
    </div>

    <div class="center-msg" id="center-msg"></div>
  </section>

  <!-- ============ GAME OVER ============ -->
  <section id="over" class="screen hidden">
    <div class="center">
      <div class="over-title">RUN ENDED</div>
      <div class="over-score" id="over-score">0</div>
      <div class="over-sub" id="over-sub">DISTANCE 0 M</div>
      <button class="btn start" data-act="restart">SPACE TO RUN AGAIN</button>
      <button class="btn tiny" data-act="menu">BACK TO MENU</button>
    </div>
  </section>

  <!-- ============ OVERLAYS ============ -->
  <div id="flash"></div>
  <div id="shade"></div>

  <section id="panel" class="modal hidden">
    <div class="modal-inner">
      <h2 id="panel-title">CREDITS</h2>
      <div id="panel-body"></div>
      <button class="btn tiny" data-act="closepanel">CLOSE</button>
    </div>
  </section>

</div>

<pre id="errbox"></pre>
<script>
  window.__errs = [];
  function __showErr(txt){
    window.__errs.push(txt);
    var b = document.getElementById('errbox');
    if (b) b.textContent = window.__errs.join('\n\n');
  }
  window.addEventListener('error', function(e){
    __showErr((e.message || 'error') + '\n' + ((e.error && (e.error.stack || e.error.message)) || '') );
  });
  window.addEventListener('unhandledrejection', function(e){
    __showErr('PROMISE REJECTION\n' + ((e.reason && (e.reason.stack || e.reason.message || e.reason)) || ''));
  });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
