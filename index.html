<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="ELSEWHERE — a hypnotic browser rhythm runner. Thread the gates, ride the beat. Procedural music, procedural worlds, zero assets.">
<title>ELSEWHERE — a rhythm runner</title>
<link rel="preload" href="css/fonts/rajdhani-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="css/fonts/chakra-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<canvas id="gl"></canvas>

<!-- ============ custom cursor ============ -->
<div id="cursor" aria-hidden="true">
  <span class="c-ring"></span>
  <span class="c-tick t"></span>
  <span class="c-tick b"></span>
  <span class="c-tick l"></span>
  <span class="c-tick r"></span>
  <span class="c-dot"></span>
</div>

<div id="ui">

  <div class="frame" aria-hidden="true">
    <i class="fc tl"></i><i class="fc tr"></i><i class="fc bl"></i><i class="fc br"></i>
  </div>

  <!-- ============ MENU ============ -->
  <section id="menu" class="screen">
    <div class="top">
      <button class="btn tiny" data-act="credits"><span>CREDITS</span></button>
      <button class="btn tiny" data-act="share"><span>SHARE</span></button>
    </div>

    <div class="center">
      <div class="eyebrow">
        <i></i><span>VOL. I &nbsp;/&nbsp; PROCEDURAL&nbsp;RUNNER</span><i></i>
      </div>
      <h1 class="wordmark">ELSEWHERE</h1>
      <div class="rule"></div>
      <div class="tagline">ANYWHERE BUT HERE</div>
      <div class="vols" id="vols">
        <button class="vol-btn" data-vol="elsewhere"><b>I</b><span>ELSEWHERE</span></button>
        <button class="vol-btn" data-vol="drift"><b>II</b><span>DRIFT</span></button>
      </div>

      <div class="diff" id="diff">
        <button class="diff-btn" data-diff="easy">EASY<em>3 LIVES</em></button>
        <button class="diff-btn" data-diff="normal">NORMAL<em>2 LIVES</em></button>
        <button class="diff-btn" data-diff="hard">HARD<em>1 LIFE</em></button>
      </div>
    </div>

    <div class="bottom">
      <button class="btn tiny" data-act="settings"><span>SETTINGS</span></button>
      <button class="btn start" data-act="start"><span>PRESS SPACE TO START</span></button>
      <button class="btn tiny" data-act="fullscreen"><span>FULL SCREEN</span></button>
    </div>

    <div class="musicbadge">
      <span class="mb-k">MUSIC</span><span class="mb-v">SYNTHESIZED</span>
    </div>
  </section>

  <!-- ============ HUD ============ -->
  <section id="hud" class="screen hidden">
    <div class="hud-tl">
      <div class="label">SCORE</div>
      <div class="value" id="hud-score">0</div>
    </div>
    <div class="hud-tc">
      <div class="label">SECTOR</div>
      <div class="value sm" id="hud-section">INTRO</div>
      <div class="lives" id="hud-lives"><i></i><i></i><i></i></div>
    </div>
    <div class="hud-tr">
      <div class="label">GATES</div>
      <div class="value dim" id="hud-gates">0/0</div>
    </div>
    <div class="hud-bl">
      <div class="label">VELOCITY</div>
      <div class="bar"><i id="hud-speed"></i></div>
      <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="hud-br">
      <div class="label">LINK</div>
      <div class="value" id="hud-combo">&times;0</div>
    </div>

    <div class="hint" id="hint"><b>HOLD TO BOOST</b><span>MOVE TO STEER</span></div>
    <div class="boost" id="hud-boost">BOOST</div>
    <div class="center-msg" id="center-msg"></div>
  </section>

  <!-- ============ GAME OVER ============ -->
  <section id="over" class="screen hidden">
    <div class="center">
      <div class="eyebrow"><i></i><span id="over-title">RUN TERMINATED</span><i></i></div>
      <div class="over-score" id="over-score">0</div>
      <div class="rank" id="over-rank">C</div>
      <div class="stats">
        <div><b id="over-gates">0/0</b><span>GATES</span></div>
        <div><b id="over-combo">0</b><span>MAX LINK</span></div>
        <div><b id="over-acc">0%</b><span>ACCURACY</span></div>
      </div>
      <button class="btn start" data-act="restart"><span>SPACE TO RUN AGAIN</span></button>
      <button class="btn tiny" data-act="menu"><span>BACK TO MENU</span></button>
    </div>
  </section>

  <div id="flash"></div>
  <div id="shade"></div>

  <section id="panel" class="modal hidden">
    <div class="modal-inner">
      <div class="eyebrow"><i></i><span id="panel-title">CREDITS</span><i></i></div>
      <div id="panel-body"></div>
      <button class="btn tiny" data-act="closepanel"><span>CLOSE</span></button>
    </div>
  </section>

</div>

<pre id="errbox"></pre>
<script>
  window.__errs = [];
  function __showErr(txt){
    window.__errs.push(txt);
    var b = document.getElementById('errbox');
    if (b) b.textContent = window.__errs.join('\n\n');
  }
  window.addEventListener('error', function(e){
    __showErr((e.message || 'error') + '\n' + ((e.error && (e.error.stack || e.error.message)) || '') );
  });
  window.addEventListener('unhandledrejection', function(e){
    __showErr('PROMISE REJECTION\n' + ((e.reason && (e.reason.stack || e.reason.message || e.reason)) || ''));
  });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
