<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SoFaraway — soundtrack render</title>
<style>
  @font-face{ font-family:"Rajdhani"; font-weight:300; font-display:swap;
    src:url("../../css/fonts/rajdhani-300.woff2") format("woff2"); }
  @font-face{ font-family:"Rajdhani"; font-weight:700; font-display:swap;
    src:url("../../css/fonts/rajdhani-700.woff2") format("woff2"); }
  @font-face{ font-family:"Chakra Petch"; font-weight:700; font-display:swap;
    src:url("../../css/fonts/chakra-700.woff2") format("woff2"); }
  html,body{ margin:0; height:100%; background:#05080a; color:#dceef8;
    font-family:"Rajdhani", system-ui, sans-serif; }
  .wrap{ max-width:720px; margin:0 auto; padding:8vh 24px; }
  h1{ font-family:"Chakra Petch"; font-weight:700; letter-spacing:.12em;
    font-size:clamp(22px,4vw,40px); margin:0 0 .2em; }
  p{ font-weight:300; letter-spacing:.06em; line-height:1.8; opacity:.72; }
  button{ appearance:none; background:none; border:1px solid #74ffdc; color:#74ffdc;
    font-family:inherit; font-weight:700; letter-spacing:.34em; font-size:12px;
    padding:1em 1.6em; cursor:pointer; margin-top:1.6em; }
  button:disabled{ opacity:.35; cursor:default; }
  #log{ margin-top:2em; font-size:13px; letter-spacing:.08em; opacity:.65;
    white-space:pre-wrap; font-variant-numeric:tabular-nums; }
  a{ color:#74ffdc; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SOUNDTRACK RENDER</h1>
  <p>
    SoFaraway ships no audio files. The score is synthesised live by the Web Audio
    engine. This page runs the same synthesizer against an
    <code>OfflineAudioContext</code> and exports the selected Volume to WAV.
  </p>
  <button id="go">RENDER TO WAV</button>
  <div id="log">idle</div>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
